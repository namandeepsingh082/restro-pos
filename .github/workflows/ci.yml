name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # The build never reaches a database, but Prisma wants the variable to
      # exist, and session.ts refuses to start on a weak secret — so CI gets a
      # throwaway one rather than a placeholder that would fail the guard.
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npx next build
